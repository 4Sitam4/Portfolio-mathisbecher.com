# Weekly update PRs for the CI actions, the Docker base images and npm packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns: ['*']
