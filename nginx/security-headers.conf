# Security headers, included in every location of nginx.conf.
#
# The site is fully static with no user-generated content: scripts and styles
# are first-party only. 'unsafe-inline' is needed for the small inline scripts
# and styles Astro emits (boot decision before first paint, scoped styles),
# and data: fonts because small font subsets are inlined into the CSS.
# 'wasm-unsafe-eval' lets the 3D rack's mesh decoder (meshopt, WebAssembly)
# compile; it does not allow eval() of JavaScript.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
