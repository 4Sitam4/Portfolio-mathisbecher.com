# Do not advertise the nginx version (in headers or error pages).
server_tokens off;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # TLS/HSTS are handled by the reverse proxy in front of this container.
    #
    # Security headers are included in every location: nginx drops the
    # inherited add_header directives as soon as a location sets its own
    # (here, Cache-Control), so declaring them once at server level would
    # silently send none of them.

    # Hashed build assets: cache forever
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else: short cache, always revalidate HTML
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
