# Do not advertise the nginx version (in headers or error pages).
server_tokens off;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Directory redirects (/en -> /en/) stay relative: never leak the internal
    # host, port 8080 or plain http behind the TLS proxy.
    absolute_redirect off;
    port_in_redirect off;

    # Compression: files are pre-compressed at build (gzip_static, see
    # Dockerfile); on-the-fly gzip covers anything else.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/json application/xml text/xml text/plain image/svg+xml;
    gzip_min_length 1024;

    # TLS/HSTS are handled by the reverse proxy in front of this container.
    #
    # Security headers are included in every location: nginx drops the
    # inherited add_header directives as soon as a location sets its own
    # (here, Cache-Control), so declaring them once at server level would
    # silently send none of them.

    # Hashed build assets: cache forever
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Pages: always revalidated (cheap 304 thanks to the ETag), so a deploy is
    # visible at once and never points at hashed assets that no longer exist.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Fixed-name files (CV PDFs, preview image, favicon, sprite): short cache.
    location ~* \.(?:pdf|png|svg|xml|txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
