# Généré par la CI depuis main (portainer-stack.yml) : ne pas modifier ici.
# Image épinglée sur le build de main a1bead3.

# Stack de référence. La CI en publie une copie sur la branche `deploy`, avec
# l'image de chaque build épinglée (sha-xxxxxxx@sha256:…) : c'est cette branche
# que suit la stack Portainer. Garder ici `:latest` sur la ligne image.
services:
  portfolio:
    image: ghcr.io/4sitam4/portfolio-mathisbecher.com:sha-a1bead3@sha256:2b1c7336638d0a59adb0f80cf55e932f7935aa709b9e16b768ca9bfa31ee1437
    container_name: portfolio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # Option A — exposition directe d'un port (reverse proxy hors docker) :
    ports:
      - "8080:8080"

    # Option B — reverse proxy dans docker (Traefik/NPM/Caddy) :
    # supprime le bloc `ports` ci-dessus et attache le container au réseau
    # partagé de ton proxy, par exemple :
    # networks:
    #   - proxy
    #
    # Exemple de labels Traefik :
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.portfolio.rule=Host(`mathisbecher.com`)
    #   - traefik.http.routers.portfolio.entrypoints=websecure
    #   - traefik.http.routers.portfolio.tls.certresolver=letsencrypt
    #   - traefik.http.services.portfolio.loadbalancer.server.port=8080

# networks:
#   proxy:
#     external: true
